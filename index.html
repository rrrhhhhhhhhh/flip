<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flipping Shirt</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(720px, 96vw);
      height: min(92vh, 980px);
      perspective: 1800px;
      cursor: none;
    }

    html,
    body,
    .card,
    .card *,
    .face,
    .face img {
      cursor: none !important;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 2.2s cubic-bezier(.22, 1, .36, 1);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .back {
      transform: rotateY(180deg);
    }
  </style>
</head>
  
<script>
const emojis = ["✶",]; // change these to whatever you want
let i = 0;

document.addEventListener("mousemove", (e) => {
  const el = document.createElement("div");
  el.textContent = emojis[i % emojis.length];
  i++;

  Object.assign(el.style, {
    position: "fixed",
    left: e.clientX + "px",
    top: e.clientY + "px",
    pointerEvents: "none",
    fontSize: "22px",
    color: "#0066FF",
    transform: "translate(-50%, -50%)",
    zIndex: "99999",
    opacity: "1",
    transition: "transform 0.8s ease-out, opacity 0.8s ease-out"
  });

  document.body.appendChild(el);

  requestAnimationFrame(() => {
    el.style.transform = "translate(-50%, -50%) scale(2)";
    el.style.opacity = "0";
  });

  setTimeout(() => el.remove(), 800);
});
</script>
  
<body>
  <div class="card" id="shirtCard">
    <div class="card-inner">
      <div class="face front">
        <img src="./shirt.jpg" alt="Front shirt" />
      </div>

      <div class="face back">
        <img src="./shirtttt.jpg" alt="Back shirt" />
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('shirtCard');

    card.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
  </script>
</body>
</html>
